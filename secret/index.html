<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, user-scalable=no">

  <title>A Little Question 💌</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="phone">

    <!-- INTRO -->
    <section class="screen intro-screen" id="introScreen">

      <p class="tiny">✦ A LITTLE SOMETHING FOR YOU ✦</p>

      <h1>
        Hi Baby,<br>
        <span>Xiany.</span>
      </h1>

      <p class="sub">
        I made something small.<br>
        Tap the envelope when you're ready.
      </p>

      <!-- ENVELOPE -->
      <button class="envelope-wrap" id="envelopeBtn">

        <div class="envelope">

          <div class="envelope-back"></div>

          <div class="letter">
            <span>for you</span>
          </div>

          <div class="flap"></div>

          <div class="envelope-front"></div>

          <div class="heart-seal">
            ♥
          </div>

        </div>

      </button>

      <p class="hint">tap to open</p>

    </section>


    <!-- QUESTION -->
    <section
      class="screen question-screen hidden"
      id="questionScreen"
    >

      <div class="paper">

        <div class="paper-tape"></div>

        <p class="tiny">
          A VERY IMPORTANT QUESTION
        </p>

        <div class="big-heart">
          ♡
        </div>

        <h2>
          Do You<br>
          <span>Love</span> me?
        </h2>

        <p class="message">
          No pressure. Just one honest<br>
          answer from you. ♡
        </p>

        <div class="buttons">

          <button class="yes" id="yesBtn">
            YES ♥
          </button>

          <button class="no" id="noBtn">
            NO
          </button>

        </div>

      </div>

    </section>


    <!-- YES SCREEN -->
    <section
      class="screen answer-screen hidden"
      id="answerScreen"
    >

      <div class="burst">
        ♥
      </div>

      <p class="tiny">
        YOU SAID YES
      </p>

      <h2>
        YAYYY!<br>
        <span>I LOVE YOU MOREE!!.</span>
      </h2>

      <p class="message">
        HIHIHIHI<br>
        I love you too babyy. ♡
      </p>

      <button class="again" id="againBtn">
        Wanna do it again?
      </button>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
